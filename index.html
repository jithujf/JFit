<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JFit">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>JFit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@keyframes spin{to{transform:rotate(360deg)}}
#loading{position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
#loading .logo{font-size:48px;font-weight:800;letter-spacing:-2px;color:#f0f0ee}
#loading .logo span{color:#e8734a}
#loading .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#e8734a;border-radius:50%;animation:spin 0.8s linear infinite}
</style>
</head>
<body>
<div id="loading">
  <img src="https://pnzydemsmqkzbaqsqrvn.supabase.co/storage/v1/object/public/app-assets/logo.png" style="width:100px;height:100px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(232,115,74,0.5));margin-bottom:8px" alt="JFit">
  <div class="logo" style="margin-bottom:16px">J<span>Fit</span></div>
  <div class="spin"></div>
</div>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
